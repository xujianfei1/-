name: Deploy

# 手动触发的正式部署 (与服务器实际架构一致: systemd portal.service, 非 Docker)
# 前置 secrets (gh secret set 配置): SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT, DEPLOY_PATH
# 流程: 打包 HEAD:个人 → 上传 → 解压 → db push → dbfix → 构建 → 重启 portal

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server (systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包源码
        run: git archive --format=tar.gz -o deploy.tar.gz HEAD:个人

      - name: 上传到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy.tar.gz
          target: /tmp/portal-deploy/

      - name: 服务器端部署 (解压/迁移/构建/重启)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            tar xzf /tmp/portal-deploy/deploy.tar.gz
            rm -f /tmp/portal-deploy/deploy.tar.gz
            ./node_modules/.bin/prisma db push --skip-generate
            dbfix
            pnpm install --frozen-lockfile
            pnpm build
            systemctl restart portal
            systemctl is-active portal
